services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foodsafe
      POSTGRES_PASSWORD: foodsafe
      POSTGRES_DB: foodsafe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodsafe"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    image: foodsafe-api:1.0
    environment:
      DATABASE_URL: postgresql+psycopg2://foodsafe:foodsafe@db:5432/foodsafe
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  simulator:
    build: ./simulator
    image: foodsafe-simulator:1.0
    environment:
      API_URL: http://api:8000
    depends_on:
      - api

  dashboard:
    build: ./dashboard
    image: foodsafe-dashboard:1.0
    depends_on:
      - api
    ports:
      - "8080:80"

  # Optional monitoring: docker compose --profile monitoring up --build
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodsafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodsafe}
      POSTGRES_DB: ${POSTGRES_DB:-foodsafe}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodsafe} -d ${POSTGRES_DB:-foodsafe}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./api
    image: foodsafe-api:1.0
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://foodsafe:foodsafe@db:5432/foodsafe}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  simulator:
    build: ./simulator
    image: foodsafe-simulator:1.0
    environment:
      API_URL: http://api:8000
      INTERVAL: "2"
      DOOR_OPEN_PROB: "0.03"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    image: foodsafe-dashboard:1.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  grafana-data:

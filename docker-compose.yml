name: haccp-cold-chain

# First run:  cp .env.example .env   (then change the passwords)
# Start:      docker compose up -d --build
# Optional Prometheus monitoring of the API:  docker compose --profile monitoring up -d

x-simulator: &simulator
  build: ./simulators
  restart: unless-stopped
  depends_on:
    mosquitto:
      condition: service_healthy

services:

  # ---------- Messaging ----------
  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Simulated sensors and truck ----------
  fridge-1:
    <<: *simulator
    command: ["python", "sensor.py"]
    environment:
      MQTT_HOST: mosquitto
      ZONE_ID: fridge-1
      ZONE_TYPE: fridge
      SENSOR_INTERVAL: ${SENSOR_INTERVAL:-5}

  freezer-1:
    <<: *simulator
    command: ["python", "sensor.py"]
    environment:
      MQTT_HOST: mosquitto
      ZONE_ID: freezer-1
      ZONE_TYPE: freezer
      SENSOR_INTERVAL: ${SENSOR_INTERVAL:-5}

  coldroom-1:
    <<: *simulator
    command: ["python", "sensor.py"]
    environment:
      MQTT_HOST: mosquitto
      ZONE_ID: coldroom-1
      ZONE_TYPE: fridge
      SENSOR_INTERVAL: ${SENSOR_INTERVAL:-5}

  truck-1:
    <<: *simulator
    command: ["python", "truck.py"]
    environment:
      MQTT_HOST: mosquitto
      TRUCK_ID: truck-1
      DELIVERY_ID: DLV-0001
      SENSOR_INTERVAL: ${SENSOR_INTERVAL:-5}

  # ---------- Backend API: MQTT ingestion, HACCP rules, REST ----------
  api:
    build: ./backend
    image: haccp-api:local
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      SENSOR_INTERVAL: ${SENSOR_INTERVAL:-5}
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Databases ----------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Dashboard ----------
  web:
    build: ./web
    image: haccp-web:local
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  # ---------- Monitoring ----------
  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      influxdb:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  mosquitto-data:
  postgres-data:
  influxdb-data:
  grafana-data:
